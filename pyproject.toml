[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# docs/reference holds vendored source that is a *specification*, not code this
# project maintains: it is kept byte-identical to what was handed over so it can
# be diffed against, and tidying its unused locals would destroy that property.
exclude = ["Example", "venv", ".specify", "docs/reference"]

[tool.ruff.lint]
# F: pyflakes (unused imports, undefined names — the checks that catch real
# breakage after a refactor). Kept deliberately narrow so the linter stays
# signal, not style noise.
select = ["F", "E9"]
